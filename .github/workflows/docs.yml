name: Docs

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time, without cancelling one already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # autodoc imports sni_app.gui, which imports PyQt6 at module scope.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0

      # sniff-gui pins sniff-core==0.1.0, which is not on PyPI, so the core
      # package has to be installed first to satisfy that requirement locally.
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e './packages/sniff-core[docs]'
          pip install -e ./packages/sniff-gui

      # -W turns docstring problems into build failures. Retried once so a
      # transient intersphinx inventory fetch cannot fail an otherwise good build.
      - name: Build HTML
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sphinx-build -b html -W --keep-going docs docs/_build/html \
            || sphinx-build -b html -W --keep-going -E docs docs/_build/html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    # Pull requests get a build for validation, but only master is published.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
